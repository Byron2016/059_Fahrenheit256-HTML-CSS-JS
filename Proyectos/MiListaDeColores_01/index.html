<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Document</title>
    <link rel="stylesheet" href="./src/css/style.css" />
    <!-- Bootstrap -->
    <link
      href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css"
      rel="stylesheet"
      integrity="sha384-QWTKZyjpPEjISv5WaRU9OFeRpok6YctnYmDr5pNlyT2bRjXh0JMhjY6hW+ALEwIH"
      crossorigin="anonymous"
    />
  </head>
  <body class="container-fluid h-100">
    <div class="row h-100">
      <header class="col-3 h-100 text-center backgroundJS">
        <p class="h1 m-2">Lista de colores</p>
        <p class="h3 m-2">Metodos con array</p>
        <img
          src="./src/image/vanillaJS.jpg"
          class="w-50 m-3 border border-dark"
          alt="Javascript vanilla"
        />
        <div class="container-fluid">
          <article class="row">
            <section class="col-12 p-2">
              <div class="bg-white p-2 shadow-lg">
                <p class="h3">Agregar color</p>
                <p>
                  Has click en el circulo del color que deseas agregar en el
                  array denominado "example".
                </p>
                <div class="d-flex justify-content-around">
                  <p id="buttomRed">RED</p>
                  <p id="buttomGreen">GREEN</p>
                  <p id="buttomBlue">BLUE</p>
                </div>
              </div>
            </section>
            <section class="col-12 p-2">
              <div class="bg-white p-2 shadow-lg">
                <p class="h3">Quitar color</p>
                <p>
                  Has click en el circulo del coloren el array denominado
                  "example" para borrar un color.
                </p>
              </div>
            </section>
            <section class="col-12 p-2">
              <div class="bg-white p-2 shadow-lg">
                <p class="h3">Example = [ <span id="desboard"></span> ]</p>
              </div>
            </section>
          </article>
        </div>
      </header>
      <main class="col-9"></main>
    </div>

    <script src="./src/js/model/Model.js"></script>
    <script src="./src/js/observer/Observers.js"></script>
    <script src="./src/js/modelView/ModelView.js"></script>
    <script src="./src/js/libs/ArrayMethod.js"></script>
    <script src="./src/js/view/View.js"></script>
    <!-- Bootstrap -->
    <script
      src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"
      integrity="sha384-YvpcrYf0tY3lHB60NNkmXc5s9fDVZLESaAA55NDzOxhy9GkcIdslK1eN7N6jIeHz"
      crossorigin="anonymous"
    ></script>
  </body>
</html>
